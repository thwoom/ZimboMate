<!doctype html>
<html lang="en" data-theme="moonlit-grimoire">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZimboMate V2 - Enhanced Game Logic Integration</title>
    <!-- Matsu theme fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@400;600;700&family=Spectral:wght@400;600;700&family=Metamorphous&family=MedievalSharp&family=Kalam:wght@400;700&family=Nunito:wght@400;700&family=Exo+2:wght@400;700&family=Lora:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #090814;
        font-family: 'Nunito', system-ui, sans-serif;
        color: #f5f3ff;
      }
      
      /* Magical Loading Screen */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        background: linear-gradient(135deg, #0b0919 0%, #1a1433 50%, #0b0919 100%);
        z-index: 9999;
        transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      
      /* Animated texture overlay */
      #app-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url(https://matsu-theme.vercel.app/texture.jpg);
        background-size: cover;
        background-repeat: repeat;
        opacity: 0.12;
        mix-blend-mode: overlay;
        filter: sepia(0.2) contrast(0.9);
        animation: texture-drift 20s ease-in-out infinite;
      }
      
      @keyframes texture-drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-10px, -10px); }
      }
      
      /* Magical particles */
      #app-splash::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(2px 2px at 20% 30%, rgba(139, 195, 74, 0.3), transparent),
          radial-gradient(2px 2px at 60% 70%, rgba(139, 195, 74, 0.2), transparent),
          radial-gradient(1px 1px at 50% 50%, rgba(139, 195, 74, 0.25), transparent),
          radial-gradient(1px 1px at 80% 10%, rgba(139, 195, 74, 0.2), transparent),
          radial-gradient(2px 2px at 90% 60%, rgba(139, 195, 74, 0.15), transparent),
          radial-gradient(1px 1px at 33% 80%, rgba(139, 195, 74, 0.2), transparent);
        background-size: 200% 200%;
        background-position: 0% 0%;
        animation: particles-float 15s ease-in-out infinite;
        pointer-events: none;
      }
      
      @keyframes particles-float {
        0%, 100% { 
          background-position: 0% 0%;
          opacity: 0.4;
        }
        50% { 
          background-position: 100% 100%;
          opacity: 0.7;
        }
      }
      
      .app-splash__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      
      /* Magical book icon container */
      .app-splash__icon-container {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      /* Glowing orb behind icon */
      .app-splash__glow {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 195, 74, 0.4) 0%, transparent 70%);
        animation: glow-pulse 3s ease-in-out infinite;
        filter: blur(20px);
      }
      
      @keyframes glow-pulse {
        0%, 100% { 
          transform: scale(1);
          opacity: 0.6;
        }
        50% { 
          transform: scale(1.2);
          opacity: 0.9;
        }
      }
      
      /* Book icon */
      .app-splash__book {
        position: relative;
        width: 80px;
        height: 64px;
        background: linear-gradient(135deg, #8bc34a 0%, #689f38 100%);
        border-radius: 4px 12px 12px 4px;
        box-shadow: 
          0 8px 32px rgba(139, 195, 74, 0.4),
          inset 0 2px 8px rgba(255, 255, 255, 0.2),
          inset 0 -2px 8px rgba(0, 0, 0, 0.3);
        animation: book-float 3s ease-in-out infinite;
      }
      
      @keyframes book-float {
        0%, 100% { transform: translateY(0px) rotate(-2deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      
      /* Book spine */
      .app-splash__book::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 12px;
        background: linear-gradient(90deg, #689f38 0%, #558b2f 100%);
        border-radius: 4px 0 0 4px;
        box-shadow: inset -2px 0 4px rgba(0, 0, 0, 0.3);
      }
      
      /* Book pages */
      .app-splash__book::after {
        content: '';
        position: absolute;
        right: 8px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: rgba(255, 255, 255, 0.3);
        box-shadow: 
          4px 0 0 rgba(255, 255, 255, 0.25),
          8px 0 0 rgba(255, 255, 255, 0.2);
      }
      
      /* Sparkles around book */
      .app-splash__sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #8bc34a;
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(139, 195, 74, 0.8);
        animation: sparkle-twinkle 2s ease-in-out infinite;
      }
      
      .app-splash__sparkle:nth-child(1) {
        top: 10%;
        left: 15%;
        animation-delay: 0s;
      }
      
      .app-splash__sparkle:nth-child(2) {
        top: 20%;
        right: 10%;
        animation-delay: 0.5s;
      }
      
      .app-splash__sparkle:nth-child(3) {
        bottom: 15%;
        left: 20%;
        animation-delay: 1s;
      }
      
      .app-splash__sparkle:nth-child(4) {
        bottom: 25%;
        right: 15%;
        animation-delay: 1.5s;
      }
      
      @keyframes sparkle-twinkle {
        0%, 100% { 
          opacity: 0;
          transform: scale(0);
        }
        50% { 
          opacity: 1;
          transform: scale(1.5);
        }
      }
      
      /* Title styling */
      #app-splash h1 {
        margin: 0;
        font-family: 'Cinzel', serif;
        font-size: clamp(2rem, 3vw + 1rem, 3.5rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #8bc34a 0%, #aed581 50%, #8bc34a 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: title-shimmer 3s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(139, 195, 74, 0.5);
        filter: drop-shadow(0 2px 8px rgba(139, 195, 74, 0.3));
      }
      
      @keyframes title-shimmer {
        0%, 100% { background-position: 0% center; }
        50% { background-position: 200% center; }
      }
      
      /* Subtitle styling */
      #app-splash p {
        margin: 0;
        font-family: 'Crimson Text', serif;
        font-size: clamp(1rem, 1.5vw + 0.5rem, 1.25rem);
        font-style: italic;
        color: rgba(174, 213, 129, 0.9);
        letter-spacing: 0.05em;
        animation: subtitle-fade 2s ease-in-out infinite;
      }
      
      @keyframes subtitle-fade {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      
      /* Loading progress bar */
      .app-splash__progress {
        position: relative;
        width: 280px;
        height: 6px;
        background: rgba(139, 195, 74, 0.15);
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 
          inset 0 1px 3px rgba(0, 0, 0, 0.3),
          0 0 20px rgba(139, 195, 74, 0.2);
      }
      
      .app-splash__progress-bar {
        height: 100%;
        background: linear-gradient(90deg, 
          #8bc34a 0%, 
          #aed581 50%, 
          #8bc34a 100%
        );
        background-size: 200% 100%;
        border-radius: 3px;
        box-shadow: 
          0 0 10px rgba(139, 195, 74, 0.6),
          0 0 20px rgba(139, 195, 74, 0.4);
        animation: progress-fill 2s ease-in-out infinite;
      }
      
      @keyframes progress-fill {
        0% { 
          width: 20%;
          background-position: 0% center;
        }
        50% { 
          width: 80%;
          background-position: 200% center;
        }
        100% { 
          width: 20%;
          background-position: 0% center;
        }
      }
      
      /* Hide animation */
      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Responsive adjustments */
      @media (max-width: 640px) {
        #app-splash {
          gap: 1.5rem;
        }
        
        .app-splash__icon-container {
          width: 100px;
          height: 100px;
        }
        
        .app-splash__glow {
          width: 120px;
          height: 120px;
        }
        
        .app-splash__book {
          width: 64px;
          height: 52px;
        }
        
        .app-splash__progress {
          width: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div class="texture"></div>
    <div id="app-splash" role="status" aria-live="polite">
      <div class="app-splash__content">
        <div class="app-splash__icon-container">
          <div class="app-splash__glow"></div>
          <div class="app-splash__sparkle"></div>
          <div class="app-splash__sparkle"></div>
          <div class="app-splash__sparkle"></div>
          <div class="app-splash__sparkle"></div>
          <div class="app-splash__book"></div>
        </div>
        <h1>ZimboMate</h1>
        <p>Awakening the storyteller's grimoire…</p>
        <div class="app-splash__progress">
          <div class="app-splash__progress-bar"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
