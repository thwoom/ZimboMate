name: Visual Tests (Playwright + Argos)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (zimbomate-v2)
        working-directory: packages/zimbomate-v2
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/zimbomate-v2
        run: npx playwright install --with-deps

      - name: Run E2E visual tests
        working-directory: packages/zimbomate-v2
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: npm run e2e


