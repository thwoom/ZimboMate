name: Semgrep Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Semgrep
      run: |
        curl -L https://github.com/returntocorp/semgrep/releases/latest/download/semgrep-v2.0.0-ubuntu-20.04.tar.gz | tar -xz
        sudo mv semgrep-v2.0.0-ubuntu-20.04/semgrep /usr/local/bin/
        semgrep --version

    - name: Run Semgrep analysis
      run: |
        npm run semgrep:scan
      continue-on-error: true

    - name: Generate Semgrep report
      run: |
        npm run semgrep:report
      continue-on-error: true

    - name: Upload Semgrep results as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: semgrep-results
        path: |
          semgrep-results.json
          semgrep-report.json
          semgrep-ci-summary.json
        retention-days: 30

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let summary = '## Semgrep Security Analysis Results\n\n';
          
          try {
            if (fs.existsSync('semgrep-ci-summary.json')) {
              const data = JSON.parse(fs.readFileSync('semgrep-ci-summary.json', 'utf8'));
              summary += `- **Total Issues:** ${data.total}\n`;
              summary += `- **Errors:** ${data.errors}\n`;
              summary += `- **Warnings:** ${data.warnings}\n`;
              summary += `- **Info:** ${data.info}\n`;
              summary += `- **Files Scanned:** ${data.files}\n\n`;
              
              if (data.errors > 0) {
                summary += '❌ **Critical security issues found!** Please review and fix before merging.\n\n';
              } else if (data.warnings > 0) {
                summary += '⚠️ **Security warnings found.** Review recommended.\n\n';
              } else {
                summary += '✅ **No security issues found.**\n\n';
              }
            } else {
              summary += '✅ **No security issues found.**\n\n';
            }
          } catch (error) {
            summary += '❌ **Error processing results.**\n\n';
          }
          
          summary += '📋 [View detailed results in artifacts](#)\n';
          summary += '🔧 [Run local analysis: `npm run semgrep`](#)\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Fail on critical issues
      if: failure()
      run: |
        if [ -f semgrep-ci-summary.json ]; then
          ERRORS=$(jq -r '.errors' semgrep-ci-summary.json)
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Critical security issues found. Build failed."
            exit 1
          fi
        fi
