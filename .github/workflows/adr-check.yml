name: ADR Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [ main, master ]

jobs:
  adr-check:
    name: Ensure tool/config changes have an ADR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ADR check
        run: |
          node scripts/adr-check.js
