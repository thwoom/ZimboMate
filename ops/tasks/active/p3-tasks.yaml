  - id: T-175
    title: Audit Other Casters for DW Compliance
    description: Audit and align non-Wizard/Cleric casters (e.g., Immolator) with DW rules
    status: open
    priority: P3
    category: rules-compliance
    estimated_hours: 5
    dependencies:
      - T-026
    acceptance:
      - Class spellcasting rules documented and enforced where applicable
      - Integration with existing character creation flow
      - Backwards compatibility with level 1 characters
      - Advanced character templates for higher levels
    features:
      - Level Selection Interface:
          - Dropdown/slider for level selection (1-10+)
          - Dynamic XP calculation based on level
          - Starting resources scaling (HP, spells, gear, coin)
          - Level-appropriate starting equipment suggestions
      - Advancement System:
          - Move selection with level prerequisites
          - Attribute advancement choices (+1 to any stat)
          - Class-specific advancement options
          - Multiclass move selection from other classes
          - Advanced move unlocking at higher levels
      - Spell Progression:
          - Automatic spell slot calculation for casters
          - Spell selection interface for known spells
          - Cantrip vs leveled spell distinction
          - Spell preparation for prepared casters
          - Ritual and utility spell access
      - Equipment Scaling:
          - Higher-level starting equipment packages
          - Magic item integration for advanced characters
          - Wealth-by-level guidelines
          - Equipment upgrade paths and suggestions
      - Validation & Balance:
          - Legal advancement path validation
          - Move prerequisite checking
          - Multiclass restriction enforcement
          - Power level balance warnings
          - Build optimization suggestions
      - Advanced Templates:
          - Pre-built higher level character templates
          - Popular multiclass combinations
          - Specialized build archetypes
          - Campaign-specific character options
    technical_implementation:
      - AdvancementService for level progression logic
      - MovePrerequisiteService for move validation
      - SpellProgressionService for caster advancement
      - EquipmentScalingService for gear recommendations
      - Enhanced character creation wizard with level steps
      - Advanced validation integration
      - Template system extensions for higher levels
    files_to_create:
      - src/services/AdvancementService.ts
      - src/services/MovePrerequisites.ts
      - src/services/SpellProgression.ts
      - src/services/EquipmentScaling.ts
      - src/data/advancementData.ts
      - src/data/movePrerequisites.ts
      - src/data/spellProgression.ts
      - src/components/LevelSelector.tsx
