  - id: T-169
    title: Implement Local LLM Integration for Game Content Generation
    intent: Add LM Studio API server integration for generating magical items, flavor text, and game assistance with structured JSON output
    owner: cursor-agent
    status: open
    priority: P2
    labels:
      - feature
      - ai
      - enhancement
    deps:
      - T-008
      - T-009
      - T-010
    steps:
      - Set up LM Studio API server integration with 7B quantized models (LLaMA-2 7B, Mistral 7B)
      - Create AiService with structured JSON response handling and error management
      - Implement global settings toggle for AI feature (stored in dungeonworld_settings)
      - Create prompt templates for magical item generation with Dungeon World tag constraints
      - Build ItemValidation.validateItem() for balance checking and output validation
      - Implement dedicated AI Generator Panel for freeform content creation
      - Add contextual "✨ Generate Item" buttons to Equipment and Inventory panels
      - Create user configuration interface (model selector, temperature slider, theme context)
      - Implement error handling with timeout (10s), retry logic, and user-friendly fallbacks
      - Add structured JSON parsing for game data and natural text for flavor descriptions
      - Create few-shot prompt examples with Dungeon World tone (concise, evocative, conversational)
      - Implement background processing for longer generations (NPC backstories, etc.)
      - Add comprehensive testing with automated validation and manual GM playtesting
      - Create user feedback system for reporting bad generations
      - Document local-only data privacy and no-cloud processing guarantees
    acceptance:
      - LM Studio integration works with 7B models (2-5s response time, max 10s timeout)
      - AI toggle in settings enables/disables feature gracefully
      - Magical item generation produces balanced items with proper Dungeon World tags
      - Structured JSON output integrates seamlessly with existing EquipmentItem interface
      - Flavor text follows Dungeon World tone (short, evocative, conversational)
      - User can configure model, temperature, and theme context
      - Error handling shows helpful messages and allows retry/editing
      - All content generation is local-only with no data sent to cloud
      - Generated items pass ItemValidation.validateItem() balance checks
      - Contextual generation buttons work in Equipment and Inventory panels
      - Dedicated AI panel provides freeform generation capabilities
      - Performance impact is minimal when AI is disabled
    artifacts:
      - src/services/AiService.ts
      - src/services/ItemValidation.ts
      - src/panels/AIGeneratorPanel/
      - src/utils/aiPrompts.ts
      - src/types/AiTypes.ts
      - src/store/aiSettings.ts
      - docs/ai-integration-guide.md
      - test/services/AiService.test.ts
      - test/services/ItemValidation.test.ts
      - config/ai-config.json
