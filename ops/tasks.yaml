  - id: T-044
    title: >-
      Complete Phase 3: Polish and optimization (Q3) A two-column or three-zone approach works well for desktop: one
      section remains persistent for vital stats, while other sections display context-specific information[1]. For
      example, a left sidebar can hold always-visible character vitals (HP, stats, etc.) and shortcut actions, and a
      main area to the right can switch between panels like Moves, Inventory, or Notes[2]. A right-hand drawer or pop-up
      panel can be used for auxiliary tools (dice roller, quick notes) that slide in when needed and hide otherwise.
      This ensures the player isn't constantly changing screens – most actions and info are accessible at a glance or a
      single click, reflecting Dungeon World's fast-paced, fiction-first gameplay.
