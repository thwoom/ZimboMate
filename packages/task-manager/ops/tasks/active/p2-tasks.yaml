      - Add skin persistence in user settings
      - Implement smooth transitions between skins
      - Ensure all game mechanics remain identical across themes (critical
        requirement)
    acceptance:
      - Users can switch between Traditional and Chronopunk themes
      - All move descriptions adapt to selected theme terminology but preserve
        exact mechanics
      - Equipment and item names reflect chosen setting while maintaining
        identical stats/tags/mechanics
      - Character classes have thematic names but identical abilities and
        progression
      - Flavor text generation uses theme-appropriate language without changing
        game rules
      - Skin changes are applied instantly and persist across sessions
      - Interface maintains functionality while adapting visual and textual
        themes
      - ALL GAME MECHANICS REMAIN IDENTICAL - only flavor text and terminology
        change
      - Performance remains fast when switching between skins
    artifacts:
      - src/services/ThematicSkinService.ts
      - src/data/skins/traditionalSkin.ts
      - src/data/skins/chronopunkSkin.ts
      - src/components/SkinSelector.tsx
      - src/hooks/useThematicSkin.ts
