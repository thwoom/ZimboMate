      - >-
        Flavor text generation uses theme-appropriate language without changing
        game rules
      - Skin changes are applied instantly and persist across sessions
      - >-
        Interface maintains functionality while adapting visual and textual
        themes
      - >-
        ALL GAME MECHANICS REMAIN IDENTICAL - only flavor text and terminology
        change
      - Performance remains fast when switching between skins
    artifacts:
