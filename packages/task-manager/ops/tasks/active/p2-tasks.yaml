  - id: T-192
    title: Implement Thematic Skin System for Flavor Text and Moves
    intent: >-
      Create a theming system that reskins flavor text, move descriptions, and
      terminology for different campaign settings
    owner: cursor-agent
    status: open
    priority: P2
    labels:
      - feature
      - theming
      - flavor
      - customization
