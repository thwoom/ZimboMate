  - id: T-188
    title: Implement Multiclass Rules Engine and Validation
    intent: Build the core system for validating official Dungeon World multiclass
      rules (Dabbler/Initiate/Master)
    owner: cursor-agent
    status: open
    priority: P2
    labels:
      - feature
      - rules-engine
      - validation
      - multiclass
    deps:
      - T-026
      - T-178
    steps:
      - Implement official DW multiclass progression rules (Dabbler → Initiate →
        Master)
      - Create "one level lower" calculation system for multiclass move selection
      - Build dependent move bundling system (wizard's cast spell + spellbook +
        prepare spells)
      - Implement multiclass level tracking (separate counters per class)
      - Create validation for illegal multiclass combinations
      - Add comprehensive unit tests for all multiclass rules
    acceptance:
      - Multiclass Dabbler/Initiate/Master progression follows official DW rules
        exactly
      - One level lower calculation works correctly for all move selections
      - Dependent moves are properly bundled as single selections
      - Level tracking counts correctly from first move of each class
      - Validation prevents illegal combinations and rule violations
      - All edge cases are handled with comprehensive test coverage
    artifacts:
      - src/services/MulticlassRulesEngine.ts
      - src/services/MulticlassValidationService.ts
      - src/data/multiclassRules.ts
      - src/data/dependentMoves.ts
      - src/utils/multiclassCalculations.ts
      - test/services/MulticlassRulesEngine.test.ts
      - docs/multiclass-rules-implementation.md
