      - Implement Traditional Dungeon World skin (baseline fantasy setting)
      - Create Chronopunk skin (cyberpunk future with time manipulation powers)
      - Build skin selector interface in settings panel
      - Implement dynamic text replacement system for moves and descriptions
      - >-
        Create thematic terminology mappings (HP→Health/Sync,
        Spells→Programs/Chronotech)
      - >-
        Add thematic equipment and item name variations (names only, stats
        unchanged)
