# Semgrep configuration for ZimboMate task management suite
# Focus on TypeScript security patterns and logic bug detection

rules:
  # Security patterns for TypeScript/React
  - id: typescript.security.unsafe-innerhtml
    pattern: |
      $ELEMENT.innerHTML = $VALUE
    message: "Unsafe innerHTML usage detected. Use textContent or sanitize input."
    severity: WARNING
    languages: [typescript, javascript]
    fix: |
      $ELEMENT.textContent = $VALUE

  - id: typescript.security.eval-usage
    pattern: eval($EXPR)
    message: "eval() usage detected. This is a security risk."
    severity: ERROR
    languages: [typescript, javascript]

  - id: typescript.security.unsafe-fetch
    pattern: |
      fetch($URL, {
        ...$CONFIG,
        credentials: "include"
      })
    message: "Fetch with credentials may expose sensitive data. Review if necessary."
    severity: WARNING
    languages: [typescript, javascript]

  # Promise handling patterns
  - id: typescript.promise.missing-catch
    pattern: |
      $PROMISE.then($HANDLER)
    message: "Promise chain missing .catch() handler"
    severity: WARNING
    languages: [typescript, javascript]
    fix: |
      $PROMISE.then($HANDLER).catch($ERROR => {
        console.error('Promise error:', $ERROR);
      })

  - id: typescript.promise.unhandled-rejection
    pattern: |
      new Promise($EXECUTOR)
    message: "Unhandled Promise creation. Consider adding error handling."
    severity: INFO
    languages: [typescript, javascript]

  # React-specific security patterns
  - id: react.security.dangerously-set-html
    pattern: |
      <div dangerouslySetInnerHTML={{ __html: $CONTENT }} />
    message: "dangerouslySetInnerHTML usage detected. Sanitize content first."
    severity: WARNING
    languages: [typescript, javascript]

  - id: react.security.unsafe-ref
    pattern: |
      const $REF = useRef<$TYPE>(null);
      $REF.current.$METHOD($ARGS);
    message: "Unsafe ref access. Check if ref.current exists before calling methods."
    severity: WARNING
    languages: [typescript, javascript]

  # Task management specific patterns
  - id: task-manager.unsafe-yaml-parse
    pattern: |
      YAML.parse($INPUT)
    message: "YAML parsing without validation. Consider validating input structure."
    severity: WARNING
    languages: [typescript, javascript]

  - id: task-manager.file-path-traversal
    pattern: |
      fs.readFileSync($PATH, 'utf8')
    message: "File path may be vulnerable to traversal attacks. Validate path."
    severity: WARNING
    languages: [typescript, javascript]

  # Performance patterns
  - id: typescript.performance.expensive-operation
    pattern: |
      $ARRAY.filter($PRED).map($TRANSFORM)
    message: "Consider using reduce() instead of filter().map() for better performance"
    severity: INFO
    languages: [typescript, javascript]

  - id: typescript.performance.unnecessary-spread
    pattern: |
      [...$ARRAY, ...$ARRAY2]
    message: "Consider using Array.concat() for better performance with large arrays"
    severity: INFO
    languages: [typescript, javascript]

  # Code quality patterns
  - id: typescript.quality.unused-variable
    pattern: |
      const $VAR = $VALUE;
    message: "Variable may be unused. Consider removing if not needed."
    severity: INFO
    languages: [typescript, javascript]

  - id: typescript.quality.console-log
    pattern: |
      console.log($ARGS)
    message: "Console.log found in production code. Consider removing or using proper logging."
    severity: INFO
    languages: [typescript, javascript]

# Exclude patterns
exclude:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "coverage/**"
  - "*.test.ts"
  - "*.spec.ts"
  - "test/**"
  - "docs/**"

# Output configuration
output:
  format: json
  output_file: semgrep-results.json
