<!DOCTYPE html>
<html>
<head>
    <title>Screenshot Viewer</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; font-family: Arial, sans-serif; }
        img { 
            max-width: 400px; 
            height: auto; 
            border: 2px solid #fff; 
            margin: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        img:hover { transform: scale(1.05); }
        img:click { transform: scale(2); }
        h1, h2 { color: #fff; }
        .screenshot-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            align-items: flex-start;
        }
        .screenshot-item {
            text-align: center;
            max-width: 450px;
        }
    </style>
</head>
<body>
    <h1>Puppeteer Screenshot Analysis</h1>
    <div class="screenshot-container">
        <div class="screenshot-item">
            <h2>Dashboard Before Click</h2>
            <img src="screenshots/dashboard-before-click.png" alt="Dashboard Before Click" onclick="window.open(this.src)">
        </div>
        
        <div class="screenshot-item">
            <h2>Modal After Click</h2>
            <img src="screenshots/modal-opened.png" alt="Modal Opened" onclick="window.open(this.src)">
        </div>
        
        <div class="screenshot-item">
            <h2>Latest Modal Screenshot</h2>
            <img src="screenshots/modal-iteration-1.png" alt="Modal Iteration 1" onclick="window.open(this.src)">
        </div>
        
        <div class="screenshot-item">
            <h2>Data Loading Debug</h2>
            <img src="screenshots/data-loading-debug.png" alt="Data Loading Debug" onclick="window.open(this.src)">
        </div>
        
        <div class="screenshot-item">
            <h2>Data Flow Test</h2>
            <img src="screenshots/data-flow-test.png" alt="Data Flow Test" onclick="window.open(this.src)">
        </div>
        
        <div class="screenshot-item">
            <h2>Before Click T-196</h2>
            <img src="screenshots/before-click-t196.png" alt="Before Click T-196" onclick="window.open(this.src)">
        </div>
    </div>
</body>
</html>
