<!DOCTYPE html>
<html>
<head>
    <title>Task Modal Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .btn { padding: 10px 20px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: white; }
    </style>
</head>
<body>
    <h1>🧪 Task Modal Test</h1>
    <p>Testing the enhanced task modal with full T-196 data...</p>
    
    <button class="btn btn-primary" onclick="testTaskModal()">
        📋 Open T-196 Task Modal
    </button>
    
    <div id="notification" style="margin-top: 20px; padding: 10px; border-radius: 5px; display: none;"></div>

    <script>
        // Sample T-196 data from YAML
        const taskT196 = {
            id: "T-196",
            title: "Implement Bond & Alignment XP Tracker",
            intent: "Create comprehensive tracking system for bond resolution and alignment-based XP triggers",
            owner: "cursor-agent",
            status: "in_progress",
            priority: "P1",
            labels: ["feature", "core-mechanics", "xp", "roleplay"],
            deps: ["T-007", "T-013"],
            steps: [
                "Create bond tracking interface with resolution workflow",
                "Implement alignment XP trigger detection and notifications",
                "Build bond editing and management system",
                "Add XP award automation for bond resolution",
                "Create alignment action logging and XP prompts",
                "Implement bond relationship visualization",
                "Add bond templates and suggestions for different character types",
                "Create alignment guidance and examples for XP triggers"
            ],
            acceptance: [
                "Users can create, edit, and resolve bonds with automatic XP awards",
                "Alignment actions trigger appropriate XP notifications",
                "Bond resolution workflow is intuitive and guides users",
                "XP awards are properly calculated and logged",
                "System integrates seamlessly with existing character sheet",
                "Bond templates help users create meaningful relationships"
            ],
            artifacts: [
                "src/components/BondTracker.tsx",
                "src/services/AlignmentXPService.ts",
                "src/models/Bond.ts",
                "src/utils/xpCalculations.ts",
                "test/services/AlignmentXPService.test.ts"
            ],
            estimated_hours: 16
        };

        function testTaskModal() {
            // Create a simple modal for testing
            const modal = document.createElement('div');
            modal.id = 'taskModal';
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                background: rgba(0,0,0,0.8); display: flex; align-items: center; 
                justify-content: center; z-index: 1000;
            `;
            
            const content = document.createElement('div');
            content.id = 'modal-content';
            content.style.cssText = `
                background: #2a2a2a; padding: 20px; border-radius: 12px; 
                max-width: 90vw; max-height: 90vh; overflow-y: auto;
                box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            `;
            
            modal.appendChild(content);
            document.body.appendChild(modal);
            
            // Add close functionality
            modal.onclick = (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            };
            
            // Use the enhanced openTaskModal function logic
            openTaskModal('T-196', taskT196);
        }

        // Helper functions from dashboard
        function getPriorityColor(priority) {
            const colors = { 'P0': '#ef4444', 'P1': '#f59e0b', 'P2': '#3b82f6', 'P3': '#6b7280' };
            return colors[priority] || '#6b7280';
        }

        function getStatusColor(status) {
            const colors = {
                'open': '#6b7280', 'in_progress': '#f59e0b', 'blocked': '#ef4444',
                'done': '#10b981', 'completed': '#10b981', 'cancelled': '#6b7280'
            };
            return colors[status] || '#6b7280';
        }

        function getPriorityIcon(priority) {
            const icons = { 'P0': '🔥', 'P1': '⚡', 'P2': '📋', 'P3': '📝' };
            return icons[priority] || '📝';
        }

        function getStatusIcon(status) {
            const icons = {
                'open': '📋', 'in_progress': '🔄', 'blocked': '🚫',
                'done': '✅', 'completed': '✅', 'cancelled': '❌'
            };
            return icons[status] || '📋';
        }

        function changeTaskStatus(taskId, newStatus) {
            showNotification(`🔄 Status changed: ${taskId} → ${newStatus}`, 'success');
        }

        function copyTaskCLI(taskId) {
            const command = `npm run tm:enhanced -- update-status ${taskId} in_progress`;
            navigator.clipboard.writeText(command).then(() => {
                showNotification(`📋 CLI command copied: ${command}`, 'success');
            }).catch(() => {
                showNotification('❌ Failed to copy command to clipboard', 'error');
            });
        }

        function editTask(taskId) {
            showNotification(`✏️ Edit functionality for ${taskId} - Coming soon!`, 'info');
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            notification.style.background = type === 'success' ? '#10b981' : 
                                          type === 'error' ? '#ef4444' : '#3b82f6';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // Enhanced openTaskModal function (simplified for testing)
        async function openTaskModal(taskId, taskData) {
            const modal = document.getElementById('taskModal');
            const content = document.getElementById('modal-content');
            
            const fullTaskData = taskData; // In real dashboard, this would fetch from YAML
            
            const priorityColor = getPriorityColor(fullTaskData.priority);
            const statusColor = getStatusColor(fullTaskData.status);
            
            content.innerHTML = `
                <div style="max-height: 85vh; overflow-y: auto; padding: 5px;">
                    <div style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%); padding: 25px; border-radius: 16px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1);">
                        <h2 style="color: #e2e8f0; margin-bottom: 15px; font-size: 1.5rem; font-weight: 700;">📋 ${fullTaskData.title}</h2>
                        
                        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
                            <span style="background: ${priorityColor}; color: white; padding: 8px 16px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                                ${getPriorityIcon(fullTaskData.priority)} ${fullTaskData.priority} Priority
                            </span>
                            <span style="background: ${statusColor}; color: white; padding: 8px 16px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                                ${getStatusIcon(fullTaskData.status)} ${fullTaskData.status.replace('_', ' ').toUpperCase()}
                            </span>
                            <span style="background: linear-gradient(135deg, #8b5cf6, #a855f7); color: white; padding: 8px 16px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                                🏷️ ${fullTaskData.labels.join(', ')}
                            </span>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; color: #94a3b8; font-size: 0.95rem;">
                            <div><strong>Task ID:</strong> <span style="color: #60a5fa; font-family: monospace;">${taskId}</span></div>
                            <div><strong>Owner:</strong> <span style="color: #34d399;">${fullTaskData.owner}</span></div>
                        </div>
                    </div>

                    <div style="background: rgba(251, 191, 36, 0.1); padding: 25px; border-radius: 16px; margin-bottom: 25px; border-left: 5px solid #fbbf24;">
                        <h3 style="color: #fbbf24; margin-bottom: 15px; display: flex; align-items: center; font-size: 1.2rem;">
                            🎯 What This Task Is About
                        </h3>
                        <p style="color: #e2e8f0; line-height: 1.7; margin: 0; font-size: 1.05rem;">
                            ${fullTaskData.intent}
                        </p>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 25px;">
                        <div style="background: rgba(52, 211, 153, 0.1); padding: 20px; border-radius: 12px; border-left: 4px solid #34d399;">
                            <h4 style="color: #34d399; margin-bottom: 10px; display: flex; align-items: center;">⏱️ Estimated Time</h4>
                            <div style="color: #e2e8f0; font-weight: 600; font-size: 1.1rem;">${fullTaskData.estimated_hours} hours</div>
                        </div>
                        
                        <div style="background: rgba(245, 158, 11, 0.1); padding: 20px; border-radius: 12px; border-left: 4px solid #f59e0b;">
                            <h4 style="color: #f59e0b; margin-bottom: 10px; display: flex; align-items: center;">🔗 Dependencies</h4>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${fullTaskData.deps.map(dep => `
                                    <span style="background: rgba(245, 158, 11, 0.2); color: #f59e0b; padding: 4px 8px; border-radius: 6px; font-size: 0.9rem; font-family: monospace;">${dep}</span>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div style="background: rgba(139, 92, 246, 0.1); padding: 25px; border-radius: 16px; margin-bottom: 25px; border-left: 5px solid #8b5cf6;">
                        <h3 style="color: #8b5cf6; margin-bottom: 20px; display: flex; align-items: center; font-size: 1.2rem;">
                            📝 Implementation Steps
                        </h3>
                        <ol style="margin: 0; padding-left: 25px; color: #e2e8f0; line-height: 1.8;">
                            ${fullTaskData.steps.map((step, index) => `
                                <li style="margin-bottom: 12px; font-size: 1.05rem;">
                                    <span style="background: rgba(139, 92, 246, 0.2); color: #a855f7; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 8px;">${index + 1}</span>
                                    ${step}
                                </li>
                            `).join('')}
                        </ol>
                    </div>

                    <div style="background: rgba(16, 185, 129, 0.1); padding: 25px; border-radius: 16px; margin-bottom: 25px; border-left: 5px solid #10b981;">
                        <h3 style="color: #10b981; margin-bottom: 20px; display: flex; align-items: center; font-size: 1.2rem;">
                            ✅ Acceptance Criteria
                        </h3>
                        <ul style="margin: 0; padding-left: 25px; color: #e2e8f0; line-height: 1.8;">
                            ${fullTaskData.acceptance.map(criteria => `
                                <li style="margin-bottom: 12px; font-size: 1.05rem;">
                                    <span style="color: #10b981; margin-right: 8px;">✓</span>
                                    ${criteria}
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div style="background: rgba(244, 114, 182, 0.1); padding: 25px; border-radius: 16px; margin-bottom: 25px; border-left: 5px solid #f472b6;">
                        <h3 style="color: #f472b6; margin-bottom: 20px; display: flex; align-items: center; font-size: 1.2rem;">
                            📦 Expected Artifacts
                        </h3>
                        <div style="display: grid; gap: 8px;">
                            ${fullTaskData.artifacts.map(artifact => `
                                <div style="background: rgba(244, 114, 182, 0.2); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.95rem; color: #f472b6; border-left: 3px solid #f472b6;">
                                    📄 ${artifact}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div style="background: rgba(255,255,255,0.05); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);">
                        <h3 style="color: #e2e8f0; margin-bottom: 20px; font-size: 1.1rem;">🎯 Task Actions</h3>
                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <button onclick="changeTaskStatus('${taskId}', 'done')" class="btn btn-success" style="background: linear-gradient(135deg, #10b981, #047857); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; color: white;">
                                ✅ Mark Complete
                            </button>
                            <button onclick="changeTaskStatus('${taskId}', 'blocked')" class="btn btn-warning" style="background: linear-gradient(135deg, #f59e0b, #d97706); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; color: white;">
                                🚫 Mark Blocked
                            </button>
                            <button onclick="copyTaskCLI('${taskId}')" class="btn btn-secondary" style="background: rgba(107, 114, 128, 0.8); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; color: white;">
                                📋 Copy CLI Command
                            </button>
                            <button onclick="editTask('${taskId}')" class="btn btn-secondary" style="background: rgba(107, 114, 128, 0.8); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; color: white;">
                                ✏️ Edit Task
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            modal.style.display = 'flex';
        }
    </script>
</body>
</html>
